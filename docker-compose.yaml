services:
  coolify-bale:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT:-7000}:${PORT:-7000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-7000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
